<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Artes & Flores</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/productos.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="app-layout">
        <aside class="main-sidebar">
            <div class="sidebar-top">
                <div class="sidebar-logo-wrapper">
                    <img src="../assets/icon2.jpg" alt="Artes & Flores" class="sidebar-logo" onerror="this.style.display='none'">
                </div>

                <nav class="sidebar-menu">
                    <a href="dashboard.html" class="menu-item">
                        <div class="menu-item-content">
                            <i data-lucide="layout-grid" class="icon-left"></i>
                            <span>Dashboard</span>
                        </div>
                    </a>

                    <a href="productos.html" class="menu-item active">
                        <div class="menu-item-content">
                            <i data-lucide="package" class="icon-left"></i>
                            <span>Productos</span>
                        </div>
                        <i data-lucide="chevron-right" class="icon-arrow"></i>
                    </a>

                    <a href="consulta_precios.html" class="menu-item">
                        <div class="menu-item-content">
                            <i data-lucide="search" class="icon-left"></i>
                            <span>Consulta de precios</span>
                        </div>
                        <i data-lucide="chevron-right" class="icon-arrow"></i>
                    </a>

                    <a href="cotizaciones.html" class="menu-item">
                        <div class="menu-item-content">
                            <i data-lucide="file-text" class="icon-left"></i>
                            <span>Cotizaciones</span>
                        </div>
                        <i data-lucide="chevron-right" class="icon-arrow"></i>
                    </a>

                    <a href="usuarios.html" class="menu-item">
                        <div class="menu-item-content">
                            <i data-lucide="users" class="icon-left"></i>
                            <span>Usuarios</span>
                        </div>
                        <i data-lucide="chevron-right" class="icon-arrow"></i>
                    </a>
                </nav>
            </div>

            <div class="sidebar-footer">
                <a href="login.html" class="menu-item logout-link">
                    <div class="menu-item-content">
                        <i data-lucide="log-out" class="icon-left"></i>
                        <span>Cerrar Sesion</span>
                    </div>
                </a>
            </div>
        </aside>

        <div class="main-viewport">
            <header class="main-navbar">
                <div class="nav-page-title">
                    <h1>PRODUCTOS</h1>
                </div>

                <div class="nav-user-area">
                    <span class="nav-role">Administrador</span>
                    <div class="nav-icons-group">
                        <button class="nav-icon-btn" id="btnPerfil"><i data-lucide="user"></i></button>
                        <button class="nav-icon-btn" id="btnSettings"><i data-lucide="settings"></i></button>
                    </div>
                </div>
            </header>

            <main class="page-content">
                <div class="products-wrapper">
                    <div class="toolbar-row">
                        <a class="btn-primary-link" href="importar-productos.html">
                            <i data-lucide="upload"></i>
                            <span>Importar CSV</span>
                        </a>
                    </div>

                    <div class="filter-card">
                        <div class="filter-group search-box">
                            <label>BUSCAR</label>
                            <div class="search-input-wrapper">
                                <i data-lucide="search" class="search-icon"></i>
                                <input type="text" id="inputBusquedaProducto" placeholder="Buscar por codigo o descripcion...">
                            </div>
                        </div>
                        <div class="filter-group select-box">
                            <label>CATEGORIA</label>
                            <div class="select-modal-wrapper">
                                <select id="selectCategoriaFiltro">
                                    <option value="">Todas</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="table-card">
                        <table class="main-products-table">
                            <thead>
                                <tr>
                                    <th>Imagen</th>
                                    <th>Codigo</th>
                                    <th>Categoria</th>
                                    <th>Stock</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaProductosBody">
                                <tr>
                                    <td colspan="5" class="table-state">Cargando productos...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="modal-overlay modal-hidden" id="modalEditar">
                    <div class="modal-container modal-editar-width">
                        <div class="modal-header">
                            <h2>Editar Producto</h2>
                            <button class="modal-close-btn" id="closeEditarBtn">&times;</button>
                        </div>

                        <div class="modal-body edit-product-layout">
                            <div class="edit-img-section">
                                <div class="edit-img-preview-box" id="editImagenPreview">
                                    <i data-lucide="image" class="placeholder-icon"></i>
                                </div>
                            </div>

                            <div class="edit-fields-section">
                                <div class="edit-row-two">
                                    <div class="form-group-modal">
                                        <label>CODIGO</label>
                                        <input type="text" id="editCodigo" disabled class="input-disabled">
                                    </div>
                                    <div class="form-group-modal">
                                        <label>CATEGORIA</label>
                                        <div class="select-modal-wrapper">
                                            <select id="editCategoria"></select>
                                           
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group-modal">
                                    <label>DESCRIPCION</label>
                                    <textarea id="editDescripcion" rows="4"></textarea>
                                </div>

                                <div class="edit-row-two">
                                    <div class="form-group-modal">
                                        <label>STOCK</label>
                                        <input type="number" id="editStock" min="0">
                                    </div>
                                    <div class="form-group-modal">
                                        <label>STOCK MINIMO</label>
                                        <input type="number" id="editStockMinimo" min="0">
                                    </div>
                                </div>

                                <div class="edit-row-two">
                                    <div class="form-group-modal">
                                        <label>FOTO URL</label>
                                        <input type="text" id="editFotoUrl" placeholder="../assets/codigo.jpg">
                                    </div>
                                </div>

                                <div class="form-group-modal">
                                    <label>PRECIOS</label>
                                    <div class="prices-grid-container">
                                        <div class="price-row-labels">
                                            <span>Normal</span>
                                            <span>Distribuidor</span>
                                        </div>
                                        <div class="price-input-pair">
                                            <label class="money-input"><span>S/</span><input data-price-field="precio_unidad_normal" type="number" step="0.01" min="0"></label>
                                            <label class="money-input money-input-orange"><span>S/</span><input data-price-field="precio_unidad_dist" type="number" step="0.01" min="0"></label>
                                        </div>
                                        <div class="price-input-pair">
                                            <label class="money-input"><span>S/</span><input data-price-field="precio_docena_normal" type="number" step="0.01" min="0"></label>
                                            <label class="money-input money-input-orange"><span>S/</span><input data-price-field="precio_docena_dist" type="number" step="0.01" min="0"></label>
                                        </div>
                                        <div class="price-input-pair">
                                            <label class="money-input"><span>S/</span><input data-price-field="precio_mayor_normal" type="number" step="0.01" min="0"></label>
                                            <label class="money-input money-input-orange"><span>S/</span><input data-price-field="precio_mayor_dist" type="number" step="0.01" min="0"></label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="modal-footer">
                            <button class="btn-modal-cancel" id="cancelEditarBtn">Cancelar</button>
                            <button class="btn-modal-save" id="saveEditarBtn">Guardar</button>
                        </div>
                    </div>
                </div>

                <div class="modal-overlay modal-hidden" id="modalEliminar">
                    <div class="modal-container modal-eliminar-width">
                        <div class="modal-header">
                            <h2>Eliminar</h2>
                            <button class="modal-close-btn" id="closeEliminarBtn">&times;</button>
                        </div>

                        <div class="modal-body text-center-modal">
                            <p class="delete-alert-text">¿Esta seguro que desea eliminar el producto?</p>
                        </div>

                        <div class="modal-footer footer-center">
                            <button class="btn-modal-cancel" id="cancelEliminarBtn">NO</button>
                            <button class="btn-modal-save" id="confirmEliminarBtn">SI</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script>
        Auth.protegerPagina(['admin', 'gerente']);
        Auth.pintarUsuario();
        Auth.prepararLogout();
        lucide.createIcons();
    </script>
    <script src="../js/productos.js"></script>
</body>

</html>
