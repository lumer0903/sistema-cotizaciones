<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizaciones - Artes & Flores</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/cotizaciones.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="app-layout">
        <aside class="main-sidebar">
            <div class="sidebar-top">
                <div class="sidebar-logo-wrapper">
                    <img src="../assets/icon2.jpg" alt="Artes & Flores" class="sidebar-logo" onerror="this.style.display='none'">
                </div>
                <nav class="sidebar-menu">
                    <a href="dashboard.html" class="menu-item"><div class="menu-item-content"><i data-lucide="layout-grid" class="icon-left"></i><span>Dashboard</span></div></a>
                    <a href="productos.html" class="menu-item"><div class="menu-item-content"><i data-lucide="package" class="icon-left"></i><span>Productos</span></div><i data-lucide="chevron-right" class="icon-arrow"></i></a>
                    <a href="consulta_precios.html" class="menu-item"><div class="menu-item-content"><i data-lucide="search" class="icon-left"></i><span>Consulta de precios</span></div><i data-lucide="chevron-right" class="icon-arrow"></i></a>
                    <a href="cotizaciones.html" class="menu-item active"><div class="menu-item-content"><i data-lucide="file-text" class="icon-left"></i><span>Cotizaciones</span></div><i data-lucide="chevron-down" class="icon-arrow"></i></a>
                    <a href="crear-cotizacion.html" class="menu-item submenu-item"><div class="menu-item-content"><span>Crear cotizacion</span></div></a>
                    <a href="cotizaciones.html" class="menu-item submenu-item active-sub"><div class="menu-item-content"><span>Mis cotizaciones</span></div></a>
                    <a href="usuarios.html" class="menu-item"><div class="menu-item-content"><i data-lucide="users" class="icon-left"></i><span>Usuarios</span></div><i data-lucide="chevron-right" class="icon-arrow"></i></a>
                </nav>
            </div>
            <div class="sidebar-footer">
                <a href="login.html" class="menu-item logout-link"><div class="menu-item-content"><i data-lucide="log-out" class="icon-left"></i><span>Cerrar Sesion</span></div></a>
            </div>
        </aside>

        <div class="main-viewport">
            <header class="main-navbar">
                <div class="nav-page-title"><h1>Cotizaciones &gt; Mis cotizaciones</h1></div>
                <div class="nav-user-area">
                    <span class="nav-role">Administrador</span>
                    <div class="nav-icons-group">
                        <button class="nav-icon-btn"><i data-lucide="user"></i></button>
                        <button class="nav-icon-btn"><i data-lucide="settings"></i></button>
                    </div>
                </div>
            </header>

            <main class="page-content">
                <section class="quotes-wrapper">
                    <div class="quotes-toolbar">
                        <label class="quote-search">
                            <i data-lucide="search"></i>
                            <input id="inputBuscarCotizacion" type="text" placeholder="Buscar cotizacion">
                        </label>
                        <label class="quote-date-filter">
                            <span>FECHA</span>
                            <input id="inputFechaCotizacion" type="date">
                        </label>
                        <label class="quote-state-filter">
                            <span>ESTADO</span>
                            <select id="selectEstadoFiltro">
                            <option value="todos">ESTADO</option>
                            <option value="borrador">BORRADOR</option>
                            <option value="enviada">ENVIADO</option>
                            <option value="aprobada">ACEPTADO</option>
                            <option value="rechazada">RECHAZADO</option>
                            </select>
                        </label>
                        <button class="quote-new-btn" id="btnNuevaCotizacion"><i data-lucide="plus"></i>NUEVA COTIZACION</button>
                    </div>

                    <table class="quotes-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>CLIENTE</th>
                                <th>FECHA</th>
                                <th>TIPO</th>
                                <th>TOTAL</th>
                                <th>ESTADO</th>
                                <th>ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCotizaciones">
                            <tr><td colspan="7">Cargando cotizaciones...</td></tr>
                        </tbody>
                    </table>
                    <strong id="contadorCotizaciones">0 Resultados</strong>
                </section>
            </main>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script>
        Auth.protegerPagina(['admin', 'gerente', 'vendedor']);
        Auth.pintarUsuario();
        Auth.prepararLogout();
        lucide.createIcons();
    </script>
    <script src="../js/cotizaciones.js"></script>
</body>

</html>
