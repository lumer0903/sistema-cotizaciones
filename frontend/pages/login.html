<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Artes & Flores</title>
    
    <link rel="stylesheet" href="../css/login.css">
    
    <script src="../js/login.js" defer></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            
            <div class="logo-wrapper">
                <img src="../assets/icon.png" alt="Artes & Flores Decoraciones" class="logo-img">
            </div>

            <h2>Iniciar sesión</h2>

            <form class="login-form">
                <div class="input-group">
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" placeholder="admin@goldcontinent.com" required>
                </div>

                <div class="input-group">
                    <label for="password">CONTRASEÑA</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <span class="password-icon" id="togglePassword">
                            <img src="../assets/eye-off.png" id="eyeIcon" alt="Mostrar contraseña" />
                        </span>
                    </div>
                </div>

                <button type="submit" class="btn-submit">INGRESAR</button>
            </form>

        </div>
    </div>

</body>
</html>
