<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Precios - Import & Export Gold Continent Eirl</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/consulta_precios.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="app-layout">
        <aside class="main-sidebar">
            <div class="sidebar-top">
                <div class="sidebar-logo-wrapper">
                    <img src="../assets/icon2.jpg" alt="Import & Export Gold Continent Eirl" class="sidebar-logo" onerror="this.style.display='none'">
                </div>
                <nav class="sidebar-menu">
                    <a href="dashboard.html" class="menu-item"><div class="menu-item-content"><i data-lucide="layout-grid" class="icon-left"></i><span>Dashboard</span></div></a>
                    <a href="productos.html" class="menu-item"><div class="menu-item-content"><i data-lucide="package" class="icon-left"></i><span>Productos</span></div><i data-lucide="chevron-right" class="icon-arrow"></i></a>
                    <a href="consulta_precios.html" class="menu-item active"><div class="menu-item-content"><i data-lucide="search" class="icon-left"></i><span>Consulta de precios</span></div><i data-lucide="chevron-right" class="icon-arrow"></i></a>
                    <a href="cotizaciones.html" class="menu-item"><div class="menu-item-content"><i data-lucide="file-text" class="icon-left"></i><span>Cotizaciones</span></div><i data-lucide="chevron-right" class="icon-arrow"></i></a>
                    <a href="usuarios.html" class="menu-item"><div class="menu-item-content"><i data-lucide="users" class="icon-left"></i><span>Usuarios</span></div><i data-lucide="chevron-right" class="icon-arrow"></i></a>
                </nav>
            </div>
            <div class="sidebar-footer">
                <a href="login.html" class="menu-item logout-link"><div class="menu-item-content"><i data-lucide="log-out" class="icon-left"></i><span>Cerrar Sesion</span></div></a>
            </div>
        </aside>

        <div class="main-viewport">
            <header class="main-navbar">
                <div class="nav-page-title"><h1>CONSULTA DE PRECIO</h1></div>
                <div class="nav-user-area">
                    <span class="nav-role">Administrador</span>
                    <div class="nav-icons-group">
                        <button class="nav-icon-btn"><i data-lucide="user"></i></button>
                        <button class="nav-icon-btn"><i data-lucide="settings"></i></button>
                    </div>
                </div>
            </header>

            <main class="page-content">
                <div class="filter-card">
                    <div class="filter-group search-group">
                        <label>BUSCAR</label>
                        <div class="search-input-wrapper">
                            <i data-lucide="search" class="search-field-icon"></i>
                            <input type="text" id="inputBuscarCodigo" placeholder="Buscar por codigo">
                        </div>
                    </div>
                    <div class="filter-group select-group">
                        <label>TIPO DE PRECIO</label>
                        <div class="select-wrapper">
                            <select id="selectTipoPrecio">
                                <option value="todos">Todos</option>
                                <option value="tienda">Precio Tienda</option>
                                <option value="distribuidor">Precio Mayorista</option>
                            </select>
                            <i data-lucide="chevron-down"></i>
                        </div>
                    </div>
                </div>

                <div class="prices-grid-layout" id="gridProductosPrecios">
                    <p class="catalog-state">Cargando productos...</p>
                </div>
            </main>
        </div>
    </div>

    <div class="modal-overlay modal-hidden" id="modalHistorial">
        <div class="modal-container">
            <div class="modal-header">
                <div>
                    <h2 class="modal-title">Historial de precio</h2>
                    <span class="modal-subtitle" id="historialCodigoText">---</span>
                </div>
                <button class="modal-close-x" id="closeHistorialX">&times;</button>
            </div>
            <div class="modal-body">
                <table class="modal-history-table">
                    <thead>
                        <tr>
                            <th>FECHA</th>
                            <th>CAMPO</th>
                            <th>ANTERIOR</th>
                            <th>NUEVO</th>
                            <th>DIF.</th>
                        </tr>
                    </thead>
                    <tbody id="modalHistorialBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script>
        Auth.protegerPagina(['admin', 'gerente', 'vendedor']);
        Auth.pintarUsuario();
        Auth.prepararLogout();
        lucide.createIcons();
    </script>
    <script src="../js/consulta_precios.js"></script>
</body>

</html>
