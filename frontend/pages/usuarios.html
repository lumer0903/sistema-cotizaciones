<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios y Roles - Artes & Flores</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/usuarios.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="app-layout">
        <aside class="main-sidebar">
            <div class="sidebar-top">
                <div class="sidebar-logo-wrapper">
                    <img src="../assets/icon2.jpg" alt="Artes & Flores" class="sidebar-logo" onerror="this.style.display='none'">
                </div>
                <nav class="sidebar-menu">
                    <a href="dashboard.html" class="menu-item"><div class="menu-item-content"><i data-lucide="layout-grid" class="icon-left"></i><span>Dashboard</span></div></a>
                    <a href="productos.html" class="menu-item"><div class="menu-item-content"><i data-lucide="package" class="icon-left"></i><span>Productos</span></div><i data-lucide="chevron-right" class="icon-arrow"></i></a>
                    <a href="consulta_precios.html" class="menu-item"><div class="menu-item-content"><i data-lucide="search" class="icon-left"></i><span>Consulta de precios</span></div><i data-lucide="chevron-right" class="icon-arrow"></i></a>
                    <a href="cotizaciones.html" class="menu-item"><div class="menu-item-content"><i data-lucide="file-text" class="icon-left"></i><span>Cotizaciones</span></div><i data-lucide="chevron-right" class="icon-arrow"></i></a>
                    <a href="usuarios.html" class="menu-item active"><div class="menu-item-content"><i data-lucide="users" class="icon-left"></i><span>Usuarios</span></div><i data-lucide="chevron-right" class="icon-arrow"></i></a>
                </nav>
            </div>
            <div class="sidebar-footer">
                <a href="login.html" class="menu-item logout-link"><div class="menu-item-content"><i data-lucide="log-out" class="icon-left"></i><span>Cerrar Sesion</span></div></a>
            </div>
        </aside>

        <div class="main-viewport">
            <header class="main-navbar">
                <div class="nav-page-title"><h1>Sistema &gt; Usuarios y Roles</h1></div>
                <div class="nav-user-area">
                    <span class="nav-role">Administrador</span>
                    <div class="nav-icons-group">
                        <button class="nav-icon-btn"><i data-lucide="user"></i></button>
                        <button class="nav-icon-btn"><i data-lucide="settings"></i></button>
                    </div>
                </div>
            </header>

            <main class="page-content">
                <section class="profile-card">
                    <div class="profile-avatar" id="perfilAvatar">AD</div>
                    <div class="profile-main">
                        <strong id="perfilNombre">Administrador</strong>
                        <span id="perfilRol">Gerente General</span>
                    </div>
                    <div class="profile-data">
                        <span>EMAIL:</span>
                        <strong id="perfilEmail">-</strong>
                    </div>
                    <button class="profile-edit" id="btnEditarPerfil"><i data-lucide="pencil"></i></button>
                </section>

                <div class="users-tabs">
                    <button class="tab-btn active" data-tab="usuarios"><i data-lucide="users"></i>Usuarios</button>
                    <button class="tab-btn" data-tab="roles"><i data-lucide="shield-check"></i>Roles y Permisos</button>
                </div>

                <section class="users-panel" id="tabUsuarios">
                    <div class="users-toolbar">
                        <label>
                            <span>USUARIO</span>
                            <div class="users-search"><i data-lucide="search"></i><input id="inputBuscarUsuario" placeholder="Buscar por nombre"></div>
                        </label>
                        <button class="orange-btn" id="btnAgregarUsuario"><i data-lucide="plus"></i>Agregar Usuario</button>
                    </div>
                    <div class="users-grid" id="usuariosGrid"></div>
                </section>

                <section class="roles-layout hidden" id="tabRoles">
                    <aside class="roles-list" id="rolesList"></aside>
                    <div class="permissions-card">
                        <div class="permissions-head">
                            <div>
                                <h2 id="rolTitulo">Permisos</h2>
                                <p id="rolDescripcion">Configura el nivel de acceso por modulo.</p>
                            </div>
                        </div>
                        <table class="permissions-table">
                            <thead>
                                <tr><th>Modulo</th><th>Sin Acceso</th><th>Solo Lectura</th><th>Edicion</th></tr>
                            </thead>
                            <tbody id="permisosBody"></tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div class="user-modal-overlay hidden" id="modalUsuario">
        <div class="user-modal">
            <div class="user-modal-header"><h2 id="modalUsuarioTitulo">Usuario</h2><button id="cerrarModalUsuario"><i data-lucide="x"></i></button></div>
            <div class="user-modal-body">
                <label>Nombre / Alias<input id="modalNombre" class="user-input"></label>
                <label>Email<input id="modalEmail" class="user-input"></label>
                <label id="passwordGroup">Password<input id="modalPassword" class="user-input" type="password" placeholder="Minimo 6 caracteres"></label>
                <label>Rol<select id="modalRol" class="user-input"><option value="admin">Administrador</option><option value="gerente">Gerente</option><option value="vendedor">Asesora de ventas</option></select></label>
                <label class="check-line"><input id="modalActivo" type="checkbox" checked> Usuario activo</label>
                <div class="user-modal-actions"><button class="gray-btn" id="cancelarModalUsuario">Cancelar</button><button class="orange-btn" id="guardarModalUsuario">Guardar</button></div>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script>
        Auth.protegerPagina(['admin', 'gerente']);
        Auth.pintarUsuario();
        Auth.prepararLogout();
        lucide.createIcons();
    </script>
    <script src="../js/usuarios.js"></script>
</body>

</html>
