app = "sistema-cotizaciones"
primary_region = "mia"

[build]
  dockerfile = "Gold_back/Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[processes]
  app = "npm run start:prod"

[deploy]
  release_command = "npx prisma migrate deploy"