# fly.toml app configuration file generated for empleado-front on 2026-08-30T00:23:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'empleado-front'
primary_region = 'iad'

[build]
  dockerfile = 'Gold_back/Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
