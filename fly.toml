# fly.toml app configuration file generated for sistema-cotizaciones on 2026-08-30T18:45:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sistema-cotizaciones'
primary_region = 'dfw'

[build]
  dockerfile = 'Gold_back/Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  CLIENT_URL = 'https://goldcontinent-admin.fly.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
